name: Vision image

on:
  push:
    branches: [main]
    paths: ["vision/**", ".github/workflows/vision.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: vision
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/neighborhood-watch-vision:latest
